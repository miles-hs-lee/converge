<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0891B2" />
    <title>Converge</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(180deg, #f5faff 0%, #eef6fc 42%, #eaf2fb 100%);
        color: #0f1d33;
      }
      .card {
        width: min(520px, calc(100vw - 32px));
        border: 1px solid rgba(148, 163, 184, 0.5);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 60px rgba(2, 6, 23, 0.12);
        padding: 22px 20px;
      }
      .title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .muted {
        margin: 10px 0 0;
        font-size: 13px;
        color: rgba(15, 29, 51, 0.7);
        line-height: 1.55;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid rgba(8, 145, 178, 0.45);
        background: linear-gradient(90deg, #0891b2, #0284c7);
        color: white;
        font-weight: 700;
        font-size: 13px;
        text-decoration: none;
      }
      .btn.secondary {
        border-color: rgba(148, 163, 184, 0.6);
        background: rgba(255, 255, 255, 0.9);
        color: #0f1d33;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="title">You're offline</p>
      <p class="muted">
        Converge needs an internet connection for live calendar and directory data. Reconnect and try again.
      </p>
      <div class="row">
        <a class="btn" href="/">Retry</a>
        <a class="btn secondary" href="/onboarding">Onboarding</a>
      </div>
    </div>
  </body>
</html>
